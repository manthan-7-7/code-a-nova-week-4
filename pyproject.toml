[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldml"
version = "1.0.0"
description = "Real-Time Financial Fraud Detection System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "imbalanced-learn>=0.12.0",
    "optuna>=3.6.0",
    "shap>=0.45.0",
    "mlflow>=2.12.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "joblib>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
